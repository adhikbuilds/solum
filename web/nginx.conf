server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames are content-addressed, so they can be cached hard. index.html cannot.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The API is proxied rather than called cross-origin, so the browser sees one origin in
  # production exactly as it does behind the Vite dev proxy. No CORS, no preflight, and the
  # frontend never needs to know where the service lives.
  location /api/ {
    proxy_pass http://massing:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A live DDA lookup is the one slow path in the system.
    proxy_read_timeout 60s;
  }

  # Single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
