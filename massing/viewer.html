<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solum · Massing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3F1; --surface:#FFFFFF; --ink:#1A0E08; --muted:#93867A;
    --line:#ECE4DC; --line-strong:#DCCEC0; --accent:#FF6B19; --accent-dim:#B84E12;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:400 14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  .panel{
    position:fixed;top:20px;left:20px;width:330px;max-height:calc(100vh - 40px);
    background:var(--surface);border:1px solid var(--line);border-radius:3px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 1px 2px rgba(26,14,8,.04),0 8px 28px rgba(26,14,8,.07);
  }
  .head{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  .eyebrow{font:500 10px/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font:400 25px/1.15 'Instrument Serif',Georgia,serif;margin-top:7px;letter-spacing:-.01em}
  .sub{font:400 12px/1.45 Inter;color:var(--muted);margin-top:5px}
  .body{overflow-y:auto;padding:4px 18px 16px}

  .sect{font:500 10px/1 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
  .row dt{color:var(--muted);font-size:12.5px}
  .row dd{font:500 13px/1 'DM Mono',monospace;text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font:500 9px/1.5 'DM Mono',monospace;letter-spacing:.07em;
    text-transform:uppercase;padding:1px 5px;border-radius:2px;margin-left:5px;vertical-align:1px}
  .t-auth{background:#EAF6EE;color:#1E7A43}
  .t-deriv{background:#EDF1F7;color:#3B5C8A}
  .t-assum{background:#FFF0E6;color:var(--accent-dim)}

  .opts{display:flex;flex-direction:column;gap:5px;margin-top:2px}
  .opt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
    padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:var(--surface);
    cursor:pointer;text-align:left;font-family:inherit;transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--line-strong);background:#FDFBF9}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:#FFF6F0}
  .opt .fl{font:500 15px/1 'DM Mono',monospace;min-width:26px}
  .opt .mt{font-size:11px;color:var(--muted);line-height:1.35}
  .opt .ut{font:500 12px/1 'DM Mono',monospace}
  .opt[aria-pressed="true"] .ut{color:var(--accent)}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
  .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .sw{width:14px;height:3px;border-radius:2px}

  .note{margin-top:12px;padding:10px 11px;border-left:2px solid var(--accent);
    background:#FFF6F0;font-size:11.5px;line-height:1.5;color:#6B4A33}
  .note b{color:var(--accent-dim);font-weight:600}

  .hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font:400 11.5px/1 Inter;color:var(--muted);background:rgba(245,243,241,.9);
    padding:7px 14px;border-radius:100px;border:1px solid var(--line)}
  .badge{position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--line);
    border-radius:3px;padding:11px 15px;text-align:right}
  .badge .n{font:500 21px/1 'DM Mono',monospace;letter-spacing:-.02em}
  .badge .l{font:500 9px/1 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel">
  <div class="head">
    <div class="eyebrow">Massing study</div>
    <h1 id="plotTitle">—</h1>
    <div class="sub" id="plotSub">—</div>
  </div>
  <div class="body">
    <div class="sect">Regulatory envelope</div>
    <dl id="reg"></dl>

    <div class="sect">Massing options</div>
    <div class="opts" id="opts"></div>

    <div class="sect">Site</div>
    <div class="legend">
      <div class="lg"><span class="sw" style="background:#C9B9A8"></span>Parcel</div>
      <div class="lg"><span class="sw" style="background:#8FA9C9"></span>Envelope</div>
      <div class="lg"><span class="sw" style="background:#FF6B19"></span>Massing</div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>

<div class="badge">
  <div class="n" id="bigGfa">—</div>
  <div class="l">GFA sqft</div>
</div>

<div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<script>
const SCENE_URL = 'fixtures/scene-3156315.json';

let scene, camera, renderer, massGroup, scn, active = 0;
const FT = 10.763910416709722;

function fmt(n, d = 0) {
  return n == null ? '—' : Number(n).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
}

// --- minimal orbit controls (avoids a second CDN dependency) --------------------------------
function orbit(cam, dom, target) {
  let r = 420, theta = -0.9, phi = 1.02, dragging = 0, px = 0, py = 0;
  const pan = new THREE.Vector3();
  function apply() {
    phi = Math.max(0.12, Math.min(1.52, phi));
    cam.position.set(
      target.x + pan.x + r * Math.sin(phi) * Math.cos(theta),
      target.y + pan.y + r * Math.cos(phi),
      target.z + pan.z + r * Math.sin(phi) * Math.sin(theta)
    );
    cam.lookAt(target.x + pan.x, target.y + pan.y, target.z + pan.z);
  }
  dom.addEventListener('mousedown', e => { dragging = e.button === 2 ? 2 : 1; px = e.clientX; py = e.clientY; });
  window.addEventListener('mouseup', () => dragging = 0);
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
    if (dragging === 1) { theta += dx * 0.006; phi -= dy * 0.006; }
    else { pan.x -= dx * 0.5 * Math.cos(theta); pan.z -= dx * 0.5 * Math.sin(theta); pan.y += dy * 0.5; }
    apply();
  });
  dom.addEventListener('contextmenu', e => e.preventDefault());
  dom.addEventListener('wheel', e => { e.preventDefault(); r = Math.max(60, Math.min(1600, r * (1 + Math.sign(e.deltaY) * 0.09))); apply(); }, {passive: false});
  apply();
  return {apply, setRadius: v => { r = v; apply(); }};
}

function ringShape(ring) {
  const s = new THREE.Shape();
  ring.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  return s;
}

function outline(rings, colour, y, width) {
  const g = new THREE.Group();
  rings.forEach(ring => {
    const pts = ring.map(([x, z]) => new THREE.Vector3(x, y, z));
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color: colour, linewidth: width || 1})));
  });
  return g;
}

function fillPlane(rings, colour, y, opacity) {
  const g = new THREE.Group();
  rings.forEach(ring => {
    const geo = new THREE.ShapeGeometry(ringShape(ring));
    geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: colour, transparent: true, opacity: opacity, side: THREE.DoubleSide, depthWrite: false
    }));
    m.position.y = y;
    g.add(m);
  });
  return g;
}

function buildMass(solid, floorH) {
  const g = new THREE.Group();
  const shell = new THREE.MeshLambertMaterial({color: 0xFF6B19, transparent: true, opacity: 0.9});
  const edgeMat = new THREE.LineBasicMaterial({color: 0x8A3A0C, transparent: true, opacity: 0.55});

  solid.footprint_rings.forEach(ring => {
    const shape = ringShape(ring);
    // One extrusion per floor, with a hairline gap, so the storeys read as storeys.
    for (let f = 0; f < solid.floors; f++) {
      const geo = new THREE.ExtrudeGeometry(shape, {depth: floorH * 0.92, bevelEnabled: false});
      geo.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geo, shell);
      mesh.position.y = f * floorH + floorH * 0.92;
      g.add(mesh);
      g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat).translateY(mesh.position.y));
    }
  });
  return g;
}

function tag(kind) {
  const t = (kind || '').toLowerCase();
  if (t.startsWith('authority')) return '<span class="tag t-auth">authority</span>';
  if (t.startsWith('derived')) return '<span class="tag t-deriv">derived</span>';
  if (t.startsWith('assumption')) return '<span class="tag t-assum">assumption</span>';
  if (t.startsWith('deferred')) return '<span class="tag t-assum">deferred</span>';
  return '';
}

function renderPanel() {
  const p = scn.plot, pr = scn.provenance;
  document.getElementById('plotTitle').textContent = 'Plot ' + p.number;
  document.getElementById('plotSub').textContent = (p.landuse || '') + ' · DDA';

  document.getElementById('reg').innerHTML = [
    ['Plot area', fmt(p.area_sqft) + ' sqft', 'authority'],
    ['Permitted GFA', fmt(p.permitted_gfa_sqft) + ' sqft', 'authority'],
    ['Implied FAR', Number(p.implied_far).toFixed(3), 'derived'],
    ['Max height', p.max_floors + ' storeys', 'authority'],
    ['Setbacks', (p.setbacks_m || []).join(' / ') + ' m', 'authority'],
    ['Parking', p.parking_rule_sqm_per_bay ? '1 bay / ' + p.parking_rule_sqm_per_bay + ' sqm' : '—', 'authority'],
    ['Floor-to-floor', scn.floor_height_m + ' m', 'assumption'],
  ].map(([k, v, t]) => `<div class="row"><dt>${k}${tag(t)}</dt><dd>${v}</dd></div>`).join('');

  document.getElementById('opts').innerHTML = scn.solids.map((s, i) => `
    <button class="opt" aria-pressed="${i === active}" onclick="select(${i})">
      <span class="fl">${s.floors}F</span>
      <span class="mt">${fmt(s.footprint_sqft)} sqft plate · ${s.height_m} m<br>${s.binding_constraint} · ${fmt(s.parking_bays)} bays</span>
      <span class="ut">${(s.gfa_utilisation * 100).toFixed(0)}%</span>
    </button>`).join('');

  const bounded = scn.geometry.bounded;
  document.getElementById('note').innerHTML = bounded
    ? `<b>Setback sides are unassigned.</b> DDA publishes four setbacks but not which edge each applies to, so the envelope is shown as a range. Above ~5 floors the GFA ceiling binds first, so this does not change achievable GFA.`
    : `<b>Setbacks incomplete.</b> DDA deferred one or more sides to another document, so this envelope is <b>not a bound</b>.`;
}

window.select = function (i) {
  active = i;
  massGroup.clear();
  massGroup.add(buildMass(scn.solids[i], scn.floor_height_m));
  document.getElementById('bigGfa').textContent = fmt(scn.solids[i].gfa_sqft);
  renderPanel();
};

function init(data) {
  scn = data;
  const stage = document.getElementById('stage');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xF5F3F1);
  scene.fog = new THREE.Fog(0xF5F3F1, 700, 1900);

  camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 6000);
  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xC9B9A8, 0.95));
  const key = new THREE.DirectionalLight(0xffffff, 0.62);
  key.position.set(-160, 260, 120);
  scene.add(key);

  const grid = new THREE.GridHelper(1600, 64, 0xDCCEC0, 0xE9E1D9);
  grid.position.y = -0.35;
  scene.add(grid);

  const g = scn.geometry;
  scene.add(fillPlane(g.parcel_rings, 0xE4D8CA, -0.05, 0.85));
  scene.add(outline(g.parcel_rings, 0xA8907A, 0.05));
  scene.add(fillPlane(g.envelope_optimistic_rings, 0x8FA9C9, 0.1, 0.18));
  scene.add(outline(g.envelope_optimistic_rings, 0x8FA9C9, 0.2));
  scene.add(outline(g.envelope_conservative_rings, 0x5C7CA6, 0.3));

  massGroup = new THREE.Group();
  scene.add(massGroup);

  const ctrl = orbit(camera, renderer.domElement, new THREE.Vector3(0, 22, 0));
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  select(0);
  (function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
}

fetch(SCENE_URL).then(r => r.json()).then(init).catch(e => {
  document.body.insertAdjacentHTML('beforeend',
    `<div style="position:fixed;inset:0;display:grid;place-items:center;padding:40px;text-align:center">
      <div><b>Could not load ${SCENE_URL}</b><br><span style="color:#93867A">${e}</span><br><br>
      <span style="color:#93867A;font-size:12px">Serve this directory over http, not file://</span></div></div>`);
});
</script>
</body>
</html>
