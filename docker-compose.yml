# Solum -- the whole stack.
#
#   docker compose up --build            # postgres + backend + web
#   docker compose run --rm seeder       # fill an empty DB from the committed seed (no fetch)
#   docker compose run --rm loader       # ...or load the dated city-wide snapshot, if you have it
#   open http://localhost:5180
#
# Three services and one job, which is the shape the city map forced. Before this there were two
# backends (the study service on :8010 and the city base on :8081), two frontends (a React app and
# a hand-written HTML page), and three generated files outside git that no container ever saw.
#
# Postgres is not a side store here. It holds the plots, the derived massing and the tile cache,
# and the tiles the browser draws are cut from it on request -- measured at 6 ms for a z16 tile
# and 1.5 ms once cached. There is no bake step between the data and the map.
services:
  postgres:
    # PostGIS, and multi-arch on purpose: postgis/postgis publishes amd64 only, which runs under
    # emulation on an Apple Silicon machine and makes every measurement in docs/prd/city-platform.md
    # meaningless.
    image: imresamu/postgis:16-3.5
    container_name: solum-pg
    environment:
      POSTGRES_USER: solum
      # Overridable from `.env` (see `.env.example`). The default is a development convenience and
      # is safe only because the container publishes to localhost.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solum}
      POSTGRES_DB: solum
    ports:
      - '5434:5432'   # 5433 is taken by the rebuild's compose file
    volumes:
      - solum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solum -d solum']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      # The repo root, because the image is three projects: packages/engine, packages/city and
      # apps/api. A context of apps/api could not COPY the packages it depends on.
      context: .
      dockerfile: apps/api/Dockerfile
    image: solum-backend:local
    container_name: solum-backend
    ports:
      - '8010:8000'
    environment:
      TZ: Asia/Dubai
      SOLUM_DSN: postgresql://solum:${POSTGRES_PASSWORD:-solum}@postgres:5432/solum
      # The seed loads as `downtown-dubai`; the full city loads as `dubai-all`. Whichever you
      # loaded, the backend has to be pointed at it -- `SOLUM_AOI=downtown-dubai docker compose up`,
      # or set it once in `.env`.
      SOLUM_AOI: ${SOLUM_AOI:-downtown-dubai}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    container_name: solum-web
    ports:
      - '5180:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # A job, not a service. It reads the dated acquisition from the host rather than from the image:
  # `solum_city/raw` is ~300 MB of immutable JSON and baking it into a layer would make every backend
  # image carry a copy of one day's Dubai.
  # The same image as the backend, not a second build of the same context. Compose names an
  # unnamed build after its service, so `loader` was building and caching its own copy -- and a
  # `docker compose build backend` left it running yesterday's code, which is exactly the class of
  # bug that makes a container "work on my machine".
  loader:
    image: solum-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['load']
    environment:
      SOLUM_DSN: postgresql://solum:${POSTGRES_PASSWORD:-solum}@postgres:5432/solum
    volumes:
      - ./packages/city/solum_city/raw:/app/packages/city/solum_city/raw:ro
      - ./packages/city/solum_city/out:/app/packages/city/solum_city/out:ro
    command: ['python', '-m', 'solum_city.db.load', '--aoi', 'dubai-all', '--warm']

  # The zero-prerequisite path. `twin/seed/downtown-dubai.json` is committed, so this needs no host
  # volume, no network and no twenty-minute fetch -- which is what a fresh clone actually has.
  seeder:
    image: solum-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['seed']
    environment:
      SOLUM_DSN: postgresql://solum:${POSTGRES_PASSWORD:-solum}@postgres:5432/solum
    command: ['python', '-m', 'solum_city.db.seed', '--warm']

volumes:
  solum-pgdata:
