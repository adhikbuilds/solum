[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solum-api"
version = "0.1.0"
description = "FastAPI service: the live DDA study and the city tile server."
requires-python = ">=3.11"
dependencies = [
    "solum-engine",
    "solum-city",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
]

[tool.setuptools]
packages = ["solum_api"]
